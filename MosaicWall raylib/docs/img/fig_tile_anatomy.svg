<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" font-family="Leelawadee UI, Tahoma, Segoe UI, sans-serif" role="img" aria-label="Tile anatomy">
<title>Tile anatomy</title>
<rect width="760" height="590" fill="#fcfcfb"/>
<text x="20" y="28" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold">Anatomy of one accent tile (drawn back to front)</text>
<text x="20" y="48" font-size="12" fill="#8a8984" text-anchor="start" font-weight="normal">Each step is one draw call; a bridged pair shares rim and fill so it reads as one shape.</text>
<rect x="60" y="70" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="130" cy="140" r="62" fill="#E2335E" opacity="0.28"/>
<text x="130" y="232" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">1 Glow</text>
<text x="130" y="250" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">radial sprite, size x2.4</text>
<text x="130" y="265" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">additive blend, alpha 60</text>
<text x="130" y="280" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">swells with the wave</text>
<rect x="310" y="70" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="380" cy="140" r="62" fill="#E2335E" opacity="0.28"/>
<rect x="351.0" y="112.0" width="64" height="64" rx="16" fill="#000000" opacity="0.35"/>
<text x="380" y="232" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2 Shadow</text>
<text x="380" y="250" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">offset +0.04 / +0.05 cell</text>
<text x="380" y="265" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">black, alpha 90</text>
<rect x="560" y="70" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="630" cy="140" r="62" fill="#E2335E" opacity="0.28"/>
<rect x="601.0" y="112.0" width="64" height="64" rx="16" fill="#000000" opacity="0.35"/>
<rect x="595.0" y="105.0" width="70" height="70" rx="19" fill="#320b15"/>
<text x="630" y="232" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">3 Rim</text>
<text x="630" y="250" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">rect expanded 0.035 cell</text>
<text x="630" y="265" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">tile colour x0.22, alpha 215</text>
<rect x="60" y="320" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="130" cy="390" r="62" fill="#E2335E" opacity="0.28"/>
<rect x="101.0" y="362.0" width="64" height="64" rx="16" fill="#000000" opacity="0.35"/>
<rect x="95.0" y="355.0" width="70" height="70" rx="19" fill="#320b15"/>
<rect x="98.0" y="358.0" width="64" height="64" rx="16" fill="#E2335E"/>
<text x="130" y="482" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">4 Fill</text>
<text x="130" y="500" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">rounded rect</text>
<text x="130" y="515" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">roundness 0.40 - 0.65</text>
<rect x="310" y="320" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="380" cy="390" r="62" fill="#E2335E" opacity="0.28"/>
<rect x="351.0" y="362.0" width="64" height="64" rx="16" fill="#000000" opacity="0.35"/>
<rect x="345.0" y="355.0" width="70" height="70" rx="19" fill="#320b15"/>
<rect x="348.0" y="358.0" width="64" height="64" rx="16" fill="#E2335E"/>
<rect x="354.0" y="364.0" width="44" height="40" rx="14" fill="#ec6f8f" opacity="0.75"/>
<text x="380" y="482" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">5 Inner shade</text>
<text x="380" y="500" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">68 % x 62 % at top-left</text>
<text x="380" y="515" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">13 % lighter, alpha 150</text>
<rect x="560" y="320" width="140" height="140" rx="8" fill="#06385D"/>
<circle cx="630" cy="390" r="62" fill="#E2335E" opacity="0.28"/>
<rect x="601.0" y="362.0" width="64" height="64" rx="16" fill="#000000" opacity="0.35"/>
<rect x="595.0" y="355.0" width="70" height="70" rx="19" fill="#320b15"/>
<rect x="598.0" y="358.0" width="64" height="64" rx="16" fill="#E2335E"/>
<rect x="604.0" y="364.0" width="44" height="40" rx="14" fill="#ec6f8f" opacity="0.75"/>
<ellipse cx="622" cy="380" rx="12" ry="9" fill="#ffffff" opacity="0.35"/>
<line x1="614" y1="388" x2="628" y2="372" stroke="#ffffff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
<text x="630" y="482" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">6 Glint</text>
<text x="630" y="500" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">soft white sprite, alpha 70</text>
<text x="630" y="515" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">+ streak alpha 38</text>
<text x="630" y="530" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">angle -25 to -55 deg</text>
<text x="20" y="576" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">Values from uMosaicRender.pas (DrawScene / DrawAccentGroup). Base-kind tiles use rim alpha 120, shade alpha 70.</text>
</svg>
