<text x="342" y="168.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Z0 Cool  (0 - 45 %)</text>
<text x="342" y="184.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">accent density 25 % - soft edges: smoothstep +/- 6 % + fbm noise</text>
<text x="342" y="200.0" font-size="10" fill="#8a8984" text-anchor="start" font-weight="normal">BASE 70, TEAL 18, SKY 5, STEEL 4, ROYAL 3</text>
