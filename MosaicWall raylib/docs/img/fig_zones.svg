<text x="342" y="332.8" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">accent density 42 % - soft edges: smoothstep +/- 6 % + fbm noise</text>
<text x="342" y="348.8" font-size="10" fill="#8a8984" text-anchor="start" font-weight="normal">BASE 50, TEAL 12, PURPLE/HOT_PINK/RED 10, ROYAL 8</text>
