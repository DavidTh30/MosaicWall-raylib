<text x="342" y="400.8" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Z2 Warm  (62 - 80 %)</text>
<text x="342" y="416.8" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">accent density 72 % - soft edges: smoothstep +/- 6 % + fbm noise</text>
<text x="342" y="432.8" font-size="10" fill="#8a8984" text-anchor="start" font-weight="normal">BASE 30, PLUM/MAGENTA/HOT_PINK 15, CORAL 10, VIOLET 8, MUSTARD 7</text>
<line x1="34" x2="330" y1="454.0" y2="454.0" stroke="#0b0b0b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="30" y="458.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal">80%</text>
<line x1="314" x2="336" y1="502.0" y2="502.0" stroke="#8a8984"/>
<text x="342" y="492.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Z3 Bloom  (80 - 100 %)</text>
<text x="342" y="508.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">accent density 98 % - soft edges: smoothstep +/- 6 % + fbm noise</text>
<text x="342" y="524.0" font-size="10" fill="#8a8984" text-anchor="start" font-weight="normal">left: CORAL, PINK_RED, MAGENTA, RED, ORANGE</text>
<text x="342" y="538.0" font-size="10" fill="#8a8984" text-anchor="start" font-weight="normal">right: LIME, LEAF, YELLOW, MINT, MUSTARD, PALE_GREEN</text>
<text x="20" y="578" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">Weights are relative within a zone; "BASE" tiles blend into the background (muted, faint rim).</text>
